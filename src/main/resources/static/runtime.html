<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Town · 赛博小镇</title>
    <link rel="stylesheet" href="/css/runtime.css">
</head>
<body>
<div class="wrap">
    <header class="brand-bar">
        <div>
            <div class="brand-mark">CYBER TOWN</div>
            <div class="brand-sub">赛博小镇实时运行台 · 地图 / 事件 / 居民</div>
        </div>
        <div class="status" id="connectionStatus">连接中...</div>
    </header>

    <div class="layout-main">
        <div class="panel broadcast-panel">
            <div class="broadcast-title">LIVE BROADCAST</div>
            <div class="broadcast-message" id="worldBroadcast">正在接收世界事件...</div>
            <div class="broadcast-time" id="worldBroadcastTime"></div>
        </div>
        <div class="panel">
            <div class="top">
                <h2 class="panel-title">今日大事</h2>
                <div class="status">WORLD / SOCIAL / LIFE</div>
            </div>
            <div class="timeline" id="eventTimeline">
                <div class="line">加载事件中...</div>
            </div>
        </div>
    </div>

    <div class="panel map-panel">
        <div class="top">
            <h2 class="panel-title">小镇地图</h2>
            <div class="status" id="mapFilterLabel">点击区块筛选居民 · 再点取消</div>
        </div>
        <div class="map-wrap">
            <div class="map-canvas" id="townMap"></div>
        </div>
        <div class="map-legend">
            <span>人数徽章 = 当前在该地点的 NPC</span>
            <span>高亮边框 = 当前筛选</span>
        </div>
    </div>

    <div class="panel">
        <div class="top">
            <h2 class="panel-title">控制台</h2>
            <span class="mode-badge" id="modeBadge">模式加载中...</span>
        </div>
        <div class="row">
            <button id="toggleModeBtn" class="secondary">切换为旁观模式</button>
            <button id="broadcastBtn" class="secondary">手动广播</button>
            <button id="reloadBtn" class="secondary">立即刷新</button>
            <button id="exportSnapshotBtn" class="secondary">导出快照</button>
            <label class="file-btn">
                导入快照
                <input id="importSnapshotInput" type="file" accept="application/json,.json" style="display:none;">
            </label>
            <button id="endSimBtn" class="danger">结束模拟</button>
        </div>
        <div class="row status" id="opStatus"></div>
    </div>

    <div class="panel news-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div>
            <div class="broadcast-title">实时新闻</div>
            <ul id="newsList" class="news-list"><li>正在抓取新闻...</li></ul>
        </div>
        <div>
            <div class="broadcast-title">新闻摘要 · 影响决策</div>
            <div class="line" id="newsBrief">加载中...</div>
            <div class="line" id="newsUpdatedAt"></div>
        </div>
    </div>

    <div class="panel operator-only" id="godPanel">
        <div class="top">
            <h2 class="panel-title">上帝模式</h2>
            <div class="status">改属性 / 关系，如「对莉莉好感+30」</div>
        </div>
        <div class="row"><label style="min-width:220px;">NPC
            <select id="godNpcSelect" class="small-input" style="margin-top:6px;"></select>
        </label></div>
        <textarea id="godInstruction" class="small-input" rows="3" placeholder="例如：把金钱改成20000；或：对莉莉好感+30；或：和老王结仇"></textarea>
        <div class="row"><button id="godApplyBtn">执行上帝指令</button><span class="status" id="godStatus"></span></div>
        <div class="line" id="godNpcReply"></div>
    </div>

    <div class="panel">
        <div class="metrics">
            <div class="metric"><div class="label">居民</div><div class="value" id="mTotal">-</div></div>
            <div class="metric"><div class="label">饥饿</div><div class="value" id="mHungry">-</div></div>
            <div class="metric"><div class="label">疲劳</div><div class="value" id="mTired">-</div></div>
            <div class="metric"><div class="label">开心</div><div class="value" id="mHappy">-</div></div>
            <div class="metric"><div class="label">更新</div><div class="value" id="mUpdated" style="font-size:14px;">-</div></div>
        </div>
    </div>

    <div class="panel">
        <div class="top">
            <h2 class="panel-title">居民状态</h2>
            <div class="status" id="npcCountText"></div>
        </div>
        <div id="npcGrid" class="npc-grid"></div>
    </div>
</div>

<div class="thought-layer" id="thoughtLayer"></div>
<div class="modal-mask" id="talkModalMask">
    <div class="modal">
        <div class="top"><h2 class="panel-title" id="talkModalTitle">对话</h2><button class="secondary" id="closeTalkModalBtn">关闭</button></div>
        <div class="chat-list" id="chatList"></div>
        <input id="talkMessageInput" class="small-input" placeholder="输入你想说的话..." />
        <div class="row"><button id="sendTalkBtn">发送</button><span class="status" id="talkModalStatus"></span></div>
    </div>
</div>
<div class="modal-mask" id="profileModalMask">
    <div class="modal">
        <div class="top"><h2 class="panel-title" id="profileModalTitle">详情</h2><button class="secondary" id="closeProfileModalBtn">关闭</button></div>
        <div class="line" id="profileModalSubtitle"></div>
        <div id="profileModalContent" class="chat-list" style="height:420px;"></div>
    </div>
</div>

<script src="/js/runtime.js"></script>
</body>
</html>
