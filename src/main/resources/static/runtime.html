<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博小镇运行面板</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #090d16;
            --panel: #121a2a;
            --line: #24314d;
            --text: #d8e3ff;
            --muted: #93a2c5;
            --primary: #4f86ff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Microsoft YaHei", sans-serif;
            background: radial-gradient(circle at top right, #1a2440, var(--bg) 40%);
            color: var(--text);
            min-height: 100vh;
        }
        .wrap {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 16px 20px;
        }
        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .broadcast-panel {
            border: 1px solid #33507a;
            background: linear-gradient(120deg, #18253d, #101a2d);
            box-shadow: inset 0 0 40px rgba(79, 134, 255, 0.08);
        }
        .broadcast-title {
            font-size: 14px;
            color: #8fb4ff;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .broadcast-message {
            font-size: 20px;
            line-height: 1.5;
            font-weight: 700;
            min-height: 64px;
        }
        .broadcast-time {
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
        }
        .top {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        h1 { margin: 0; font-size: 24px; }
        .status { color: var(--muted); font-size: 14px; }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }
        button {
            background: var(--primary);
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: 600;
        }
        button.secondary { background: #334155; }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }
        .metric {
            background: #0d1423;
            border: 1px solid #1e2c46;
            border-radius: 10px;
            padding: 10px;
        }
        .metric .label { color: var(--muted); font-size: 13px; }
        .metric .value { font-size: 20px; font-weight: 700; margin-top: 4px; }
        .npc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
        }
        .card {
            border: 1px solid #24314d;
            background: #0d1423;
            border-radius: 10px;
            padding: 10px;
        }
        .name {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 6px;
        }
        .line {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 3px;
            word-break: break-word;
        }
        .bar {
            height: 7px;
            border-radius: 4px;
            background: #1f2937;
            overflow: hidden;
            margin: 5px 0 7px;
        }
        .bar > span {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #22d3ee, #4f86ff);
        }
        .small-input {
            width: 100%;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 6px 8px;
            background: #0a1020;
            color: var(--text);
            margin-top: 6px;
        }
        .tiny-btn {
            margin-top: 6px;
            padding: 6px 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="panel broadcast-panel">
        <div class="broadcast-title">世界广播</div>
        <div class="broadcast-message" id="worldBroadcast">正在接收世界事件...</div>
        <div class="broadcast-time" id="worldBroadcastTime"></div>
    </div>

    <div class="panel">
        <div class="top">
            <h1>赛博小镇运行面板</h1>
            <div class="status" id="connectionStatus">连接中...</div>
        </div>
        <div class="row">
            <button id="broadcastBtn" class="secondary">手动广播状态</button>
            <button id="reloadBtn" class="secondary">立即刷新</button>
            <button id="endSimBtn">结束模拟并返回初始化</button>
        </div>
        <div class="row status" id="opStatus"></div>
    </div>

    <div class="panel">
        <div class="top">
            <h1 style="font-size:20px;">上帝模式</h1>
            <div class="status">用自然语言直接修改某个NPC属性</div>
        </div>
        <div class="row">
            <label>NPC
                <select id="godNpcSelect" class="small-input" style="min-width:200px;"></select>
            </label>
        </div>
        <textarea id="godInstruction" class="small-input" rows="3" placeholder="例如：把这个NPC的金钱改成20000，负债清零，目标改成三个月内买房，技能提升到85"></textarea>
        <div class="row">
            <button id="godApplyBtn">执行上帝指令</button>
            <span class="status" id="godStatus"></span>
        </div>
        <div class="line" id="godNpcReply"></div>
    </div>

    <div class="panel">
        <div class="metrics">
            <div class="metric"><div class="label">NPC 总数</div><div class="value" id="mTotal">-</div></div>
            <div class="metric"><div class="label">饥饿人数</div><div class="value" id="mHungry">-</div></div>
            <div class="metric"><div class="label">疲劳人数</div><div class="value" id="mTired">-</div></div>
            <div class="metric"><div class="label">开心人数</div><div class="value" id="mHappy">-</div></div>
            <div class="metric"><div class="label">最后更新时间</div><div class="value" id="mUpdated">-</div></div>
        </div>
    </div>

    <div class="panel">
        <div class="top">
            <h1 style="font-size:20px;">实时 NPC 状态</h1>
            <div class="status" id="npcCountText"></div>
        </div>
        <div id="npcGrid" class="npc-grid"></div>
    </div>
</div>

<script>
    const connectionStatus = document.getElementById("connectionStatus");
    const opStatus = document.getElementById("opStatus");
    const npcGrid = document.getElementById("npcGrid");
    const npcCountText = document.getElementById("npcCountText");

    const mTotal = document.getElementById("mTotal");
    const mHungry = document.getElementById("mHungry");
    const mTired = document.getElementById("mTired");
    const mHappy = document.getElementById("mHappy");
    const mUpdated = document.getElementById("mUpdated");
    const worldBroadcast = document.getElementById("worldBroadcast");
    const worldBroadcastTime = document.getElementById("worldBroadcastTime");
    const godNpcSelect = document.getElementById("godNpcSelect");
    const godInstruction = document.getElementById("godInstruction");
    const godStatus = document.getElementById("godStatus");
    const godNpcReply = document.getElementById("godNpcReply");

    let source = null;

    function setOpStatus(text, isError = false) {
        opStatus.style.color = isError ? "#f87171" : "#93a2c5";
        opStatus.textContent = text;
    }

    async function postJson(url) {
        const resp = await fetch(url, { method: "POST" });
        if (!resp.ok) {
            throw new Error(`请求失败: ${url}`);
        }
        const ct = resp.headers.get("content-type") || "";
        if (ct.includes("application/json")) return resp.json();
        return resp.text();
    }

    function renderNPCList(list) {
        const npcs = Array.isArray(list) ? list : [];
        npcCountText.textContent = `共 ${npcs.length} 人`;
        npcGrid.innerHTML = npcs.map((n) => {
            const energy = Number(n.energy ?? n.stats?.energy ?? 0);
            const hunger = Number(n.hunger ?? n.stats?.hunger ?? 0);
            const happiness = Number(n.happiness ?? n.stats?.happiness ?? 0);
            const socialNeed = Number(n.socialNeed ?? n.stats?.socialNeed ?? 0);
            const mood = n.mood ?? getMoodText(happiness);
            const statusSummary = n.statusSummary ?? getStatusSummary({ energy, hunger, happiness, socialNeed });
            const goal = n.currentGoal ?? n.goal ?? "-";
            const money = Number(n.money ?? n.stats?.money ?? 0);
            const savings = Number(n.savings ?? n.stats?.savings ?? 0);
            const debt = Number(n.debt ?? n.stats?.debt ?? 0);
            const educationLevel = n.educationLevel ?? n.stats?.educationLevel ?? "-";
            const workExperience = Number(n.workExperience ?? n.stats?.workExperience ?? 0);
            const skillLevel = Number(n.skillLevel ?? n.stats?.skillLevel ?? 0);
            const knowledgeLevel = Number(n.knowledgeLevel ?? n.stats?.knowledgeLevel ?? 0);
            const reputation = Number(n.reputation ?? n.stats?.reputation ?? 0);
            const health = Number(n.health ?? n.stats?.health ?? 0);
            return `
                <div class="card">
                    <div class="name">${n.name || "未知"} · ${n.occupation || "-"}</div>
                    <div class="line">位置：${n.location || n.currentLocation || "-"}</div>
                    <div class="line">动作：${n.action || n.currentAction || "-"}</div>
                    <div class="line">目标：${goal}</div>
                    <div class="line">状态：${statusSummary}</div>
                    <div class="line">心情：${mood}</div>
                    <div class="line">现金：${money.toFixed(0)} | 储蓄：${savings.toFixed(0)} | 负债：${debt.toFixed(0)}</div>
                    <div class="line">学历：${educationLevel} | 经验(月)：${workExperience}</div>
                    <div class="line">技能：${skillLevel} | 知识：${knowledgeLevel} | 声望：${reputation} | 健康：${health}</div>
                    <div class="line">能量 ${energy}</div><div class="bar"><span style="width:${Math.max(0, Math.min(100, energy))}%"></span></div>
                    <div class="line">饥饿 ${hunger}</div><div class="bar"><span style="width:${Math.max(0, Math.min(100, hunger))}%"></span></div>
                    <div class="line">快乐 ${happiness}</div><div class="bar"><span style="width:${Math.max(0, Math.min(100, happiness))}%"></span></div>
                    <div class="line">社交需求 ${socialNeed}</div><div class="bar"><span style="width:${Math.max(0, Math.min(100, socialNeed))}%"></span></div>
                    <input id="talk-input-${n.id}" class="small-input" placeholder="和 ${n.name || "NPC"} 说点什么..." />
                    <button class="tiny-btn" onclick="talkToNpc('${n.id}')">发送对话</button>
                    <div class="line" id="talk-reply-${n.id}"></div>
                </div>
            `;
        }).join("");
        syncGodNpcOptions(npcs);
    }

    function getMoodText(happiness) {
        if (happiness > 80) return "高兴";
        if (happiness > 60) return "还行";
        if (happiness > 40) return "一般";
        if (happiness > 20) return "沮丧";
        return "痛苦";
    }

    function getStatusSummary(stats) {
        const tags = [];
        if (stats.hunger > 70) tags.push("饥饿");
        if (stats.energy < 30) tags.push("疲劳");
        if (stats.happiness < 30) tags.push("低落");
        if (stats.socialNeed > 70) tags.push("需社交");
        return tags.length ? tags.join("、") : "正常";
    }

    function syncGodNpcOptions(npcs) {
        const currentValue = godNpcSelect.value;
        godNpcSelect.innerHTML = npcs.map((n) => `<option value="${n.id}">${n.name} (${n.occupation || "-"})</option>`).join("");
        if (currentValue) {
            godNpcSelect.value = currentValue;
        }
    }

    async function refreshSummary() {
        const [summaryResp, npcsResp] = await Promise.all([
            fetch("/api/town/stats/summary"),
            fetch("/api/town/npcs")
        ]);
        if (!summaryResp.ok || !npcsResp.ok) {
            throw new Error("读取汇总信息失败");
        }
        const summary = await summaryResp.json();
        const npcs = await npcsResp.json();
        if (!Array.isArray(npcs) || npcs.length === 0) {
            window.location.href = "/";
            return;
        }
        mTotal.textContent = summary.total ?? npcs.length ?? "-";
        mHungry.textContent = summary.hungryCount ?? "-";
        mTired.textContent = summary.tiredCount ?? "-";
        mHappy.textContent = summary.happyCount ?? "-";
        mUpdated.textContent = new Date().toLocaleTimeString();
        renderNPCList(npcs);
    }

    function applyRealtimePayload(data) {
        if (!data || !Array.isArray(data.npcs)) return;
        renderNPCList(data.npcs);
        mTotal.textContent = data.count ?? data.npcs.length;
        mUpdated.textContent = new Date().toLocaleTimeString();
    }

    function connectSSE() {
        if (source) source.close();
        source = new EventSource("/api/town/npcs/status/stream");
        connectionStatus.textContent = "SSE 连接中...";

        source.addEventListener("initial", (ev) => {
            const data = JSON.parse(ev.data);
            applyRealtimePayload(data);
            connectionStatus.textContent = "SSE 已连接";
        });
        source.addEventListener("update", (ev) => {
            const data = JSON.parse(ev.data);
            applyRealtimePayload(data);
            connectionStatus.textContent = "实时更新中";
        });
        source.addEventListener("connected", () => {
            connectionStatus.textContent = "SSE 已连接";
        });
        source.onerror = () => {
            connectionStatus.textContent = "SSE断开，使用轮询";
        };
    }

    async function refreshWorldBroadcast() {
        try {
            const resp = await fetch("/api/town/world/broadcast");
            if (!resp.ok) {
                return;
            }
            const data = await resp.json();
            worldBroadcast.textContent = data.message || "暂无新的世界广播";
            worldBroadcastTime.textContent = "更新时间: " + new Date(data.timestamp || Date.now()).toLocaleTimeString();
        } catch (_) {
        }
    }

    async function talkToNpc(id) {
        const input = document.getElementById(`talk-input-${id}`);
        const reply = document.getElementById(`talk-reply-${id}`);
        const message = input?.value?.trim();
        if (!message) {
            if (reply) reply.textContent = "请输入对话内容";
            return;
        }
        try {
            const resp = await fetch(`/api/town/npc/${id}/talk`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message })
            });
            if (!resp.ok) throw new Error("对话失败");
            const data = await resp.json();
            if (reply) reply.textContent = `${data.npc}: ${data.response}`;
            input.value = "";
        } catch (e) {
            if (reply) reply.textContent = e.message;
        }
    }

    async function applyGodCommand() {
        const id = godNpcSelect.value;
        const instruction = godInstruction.value.trim();
        if (!id || !instruction) {
            godStatus.textContent = "请选择NPC并输入指令";
            return;
        }
        godStatus.textContent = "上帝指令执行中...";
        godNpcReply.textContent = "";
        try {
            const resp = await fetch(`/api/town/npc/${id}/god-command`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ instruction })
            });
            if (!resp.ok) throw new Error("上帝指令执行失败");
            const data = await resp.json();
            godStatus.textContent = data.message || "执行成功";
            if (data.npcReply) {
                godNpcReply.textContent = `${data.npcName || "NPC"}：${data.npcReply}`;
            }
            godInstruction.value = "";
            await refreshSummary();
        } catch (e) {
            godStatus.textContent = e.message;
        }
    }

    async function runBroadcast() {
        setOpStatus("正在手动广播...");
        try {
            const msg = await postJson("/api/town/broadcast/status");
            setOpStatus(typeof msg === "string" ? msg : "广播完成");
        } catch (e) {
            setOpStatus(e.message, true);
        }
    }

    async function endSimulationAndBack() {
        setOpStatus("正在结束模拟并清空数据...");
        try {
            const data = await postJson("/api/town/simulation/end");
            setOpStatus(`${data.message}（已清空 ${data.deletedCount} 人）`);
            setTimeout(() => {
                window.location.href = "/";
            }, 400);
        } catch (e) {
            setOpStatus(e.message, true);
        }
    }

    document.getElementById("broadcastBtn").addEventListener("click", runBroadcast);
    document.getElementById("reloadBtn").addEventListener("click", () => refreshSummary().catch(err => setOpStatus(err.message, true)));
    document.getElementById("endSimBtn").addEventListener("click", endSimulationAndBack);
    document.getElementById("godApplyBtn").addEventListener("click", applyGodCommand);
    window.talkToNpc = talkToNpc;

    refreshSummary().catch(err => setOpStatus(err.message, true));
    refreshWorldBroadcast();
    connectSSE();
    setInterval(() => {
        if (connectionStatus.textContent.includes("轮询")) {
            refreshSummary().catch(() => {});
        }
    }, 5000);
    setInterval(refreshWorldBroadcast, 8000);
</script>
</body>
</html>
