<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博小镇初始化</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0d1018;
            --panel: #161b26;
            --text: #d8deea;
            --muted: #8f9bb3;
            --accent: #4f86ff;
            --ok: #2dd4bf;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Microsoft YaHei", sans-serif;
            background: radial-gradient(circle at top, #1a2030 0%, var(--bg) 45%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .panel {
            width: 100%;
            max-width: 760px;
            background: var(--panel);
            border: 1px solid #252d40;
            border-radius: 12px;
            padding: 20px;
        }
        h1 { margin: 0 0 8px; font-size: 24px; }
        p { color: var(--muted); margin: 0 0 14px; }
        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 10px;
        }
        input[type="number"] {
            width: 90px;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f1522;
            color: var(--text);
        }
        label { font-size: 14px; color: var(--muted); }
        button {
            background: var(--accent);
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 600;
        }
        button:disabled { opacity: 0.7; cursor: wait; }
        .status { margin-top: 8px; color: var(--ok); min-height: 20px; }
    </style>
</head>
<body>
<div class="panel">
    <h1>赛博小镇初始化</h1>
    <p>首次进入先创建居民。初始化成功后会自动跳转到运行页面。</p>
    <div class="row">
        <button id="initBtn">普通初始化（默认10人）</button>
    </div>
    <div class="row">
        <label for="count">AI人数：</label>
        <input id="count" type="number" min="1" max="20" value="5">
        <label><input id="clearExisting" type="checkbox"> 清空现有 NPC</label>
        <button id="aiInitBtn">AI 初始化</button>
    </div>
    <div id="status" class="status">检查当前小镇状态中...</div>
</div>

<script>
    const initBtn = document.getElementById("initBtn");
    const aiInitBtn = document.getElementById("aiInitBtn");
    const countInput = document.getElementById("count");
    const clearCheckbox = document.getElementById("clearExisting");
    const statusEl = document.getElementById("status");

    function setStatus(text, isError = false) {
        statusEl.style.color = isError ? "#f87171" : "#2dd4bf";
        statusEl.textContent = text;
    }

    function gotoRuntime() {
        window.location.href = "/runtime.html";
    }

    async function ensureNeedInit() {
        try {
            const resp = await fetch("/api/town/npcs");
            if (!resp.ok) {
                setStatus("读取小镇状态失败，请稍后重试", true);
                return;
            }
            const npcs = await resp.json();
            if (Array.isArray(npcs) && npcs.length > 0) {
                gotoRuntime();
                return;
            }
            setStatus("当前无NPC，请选择初始化方式");
        } catch (err) {
            setStatus("读取小镇状态失败", true);
        }
    }

    async function runInit() {
        initBtn.disabled = true;
        aiInitBtn.disabled = true;
        setStatus("正在普通初始化...");
        try {
            const resp = await fetch("/api/town/init", { method: "POST" });
            if (!resp.ok) throw new Error("普通初始化失败");
            setStatus("初始化完成，正在进入运行页面...");
            setTimeout(gotoRuntime, 500);
        } catch (err) {
            setStatus(err.message, true);
        } finally {
            initBtn.disabled = false;
            aiInitBtn.disabled = false;
        }
    }

    async function runAIInit() {
        initBtn.disabled = true;
        aiInitBtn.disabled = true;
        const count = Number(countInput.value || 5);
        const clearExisting = clearCheckbox.checked;
        setStatus("AI 正在生成中...");
        try {
            const resp = await fetch("/api/town/init/ai", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ count, clearExisting })
            });
            if (!resp.ok) throw new Error("AI初始化失败");
            const data = await resp.json();
            setStatus(`${data.message}，正在进入运行页面...`);
            setTimeout(gotoRuntime, 500);
        } catch (err) {
            setStatus(err.message, true);
        } finally {
            initBtn.disabled = false;
            aiInitBtn.disabled = false;
        }
    }

    initBtn.addEventListener("click", runInit);
    aiInitBtn.addEventListener("click", runAIInit);
    ensureNeedInit();
</script>
</body>
</html>
