<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博小镇 - AI人物初始化</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0d1018;
            --panel: #161b26;
            --text: #d8deea;
            --muted: #8f9bb3;
            --accent: #4f86ff;
            --ok: #2dd4bf;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Microsoft YaHei", sans-serif;
            background: radial-gradient(circle at top, #1a2030 0%, var(--bg) 45%);
            color: var(--text);
            min-height: 100vh;
        }
        .container {
            max-width: 980px;
            margin: 32px auto;
            padding: 0 16px 32px;
        }
        .panel {
            background: var(--panel);
            border: 1px solid #252d40;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        h1 { margin: 0 0 8px; font-size: 24px; }
        p { color: var(--muted); margin: 0 0 12px; }
        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        input[type="number"] {
            width: 90px;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f1522;
            color: var(--text);
        }
        label { font-size: 14px; color: var(--muted); }
        button {
            background: var(--accent);
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 600;
        }
        button:disabled { opacity: 0.7; cursor: wait; }
        .status { margin-top: 10px; color: var(--ok); min-height: 20px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }
        .card {
            background: #0f1522;
            border: 1px solid #25314c;
            border-radius: 10px;
            padding: 12px;
        }
        .name { font-weight: 700; margin-bottom: 6px; }
        .meta { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    </style>
</head>
<body>
<div class="container">
    <div class="panel">
        <h1>AI 人物初始化</h1>
        <p>调用后端大模型，随机创建 NPC 并保存到当前小镇。</p>
        <div class="row">
            <label for="count">人数：</label>
            <input id="count" type="number" min="1" max="20" value="5">
            <label>
                <input id="clearExisting" type="checkbox">
                先清空现有 NPC
            </label>
            <button id="generateBtn">AI 生成</button>
            <button id="refreshBtn" type="button">刷新列表</button>
        </div>
        <div id="status" class="status"></div>
    </div>

    <div class="panel">
        <h1 style="font-size:20px;">当前人物</h1>
        <div id="npcGrid" class="grid"></div>
    </div>
</div>

<script>
    const generateBtn = document.getElementById("generateBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const countInput = document.getElementById("count");
    const clearCheckbox = document.getElementById("clearExisting");
    const statusEl = document.getElementById("status");
    const npcGrid = document.getElementById("npcGrid");

    function setStatus(text, isError = false) {
        statusEl.style.color = isError ? "#f87171" : "#2dd4bf";
        statusEl.textContent = text;
    }

    function npcCard(npc) {
        return `
            <div class="card">
                <div class="name">${npc.name ?? "未知"}</div>
                <div class="meta">职业：${npc.occupation ?? "-"}</div>
                <div class="meta">公司：${npc.employer ?? "自由职业"}</div>
                <div class="meta">地点：${npc.currentLocation ?? "-"}</div>
                <div class="meta">动作：${npc.currentAction ?? "-"}</div>
                <div class="meta">目标：${npc.currentGoal ?? "-"}</div>
            </div>
        `;
    }

    async function loadAllNPCs() {
        const resp = await fetch("/api/town/npcs");
        if (!resp.ok) {
            throw new Error("加载 NPC 失败");
        }
        const npcs = await resp.json();
        npcGrid.innerHTML = npcs.map(npcCard).join("");
        setStatus(`当前共 ${npcs.length} 个 NPC`);
    }

    async function generateNPCs() {
        const count = Number(countInput.value || 5);
        const clearExisting = clearCheckbox.checked;
        generateBtn.disabled = true;
        setStatus("AI 正在生成中，请稍候...");
        try {
            const resp = await fetch("/api/town/init/ai", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ count, clearExisting })
            });
            if (!resp.ok) {
                throw new Error("调用 AI 初始化接口失败");
            }
            const data = await resp.json();
            setStatus(`${data.message}：新增 ${data.createdCount}，总计 ${data.totalCount}`);
            await loadAllNPCs();
        } catch (err) {
            setStatus(err.message, true);
        } finally {
            generateBtn.disabled = false;
        }
    }

    generateBtn.addEventListener("click", generateNPCs);
    refreshBtn.addEventListener("click", loadAllNPCs);
    loadAllNPCs().catch(err => setStatus(err.message, true));
</script>
</body>
</html>
